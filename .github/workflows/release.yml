name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.tag.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
      - run: test -n "${{ steps.ver.outputs.version }}"
      - id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: Wavvon/Wavvon-server
          ref: b991cb192df86ee002d10c065872cb8beaeab3c0
          path: wavvon-server
          sparse-checkout: crates/identity/wire-vectors.json
          sparse-checkout-cone-mode: false
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.tag.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e . --group dev
      - if: steps.tag.outputs.exists == 'false'
        run: python scripts/check
        env:
          CI: "true"
          WAVVON_WIRE_VECTORS: wavvon-server/crates/identity/wire-vectors.json
      - if: steps.tag.outputs.exists == 'false'
        run: python -m build
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wavvon-sdk/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"
          gh release create "v${{ needs.build.outputs.version }}" --generate-notes --title "v${{ needs.build.outputs.version }}"
